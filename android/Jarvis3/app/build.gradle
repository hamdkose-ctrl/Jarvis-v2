plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hamdi.jarvis'
    compileSdk 35

    defaultConfig {
        applicationId "com.hamdi.jarvis"
        minSdk 26
        targetSdk 35
        versionCode 22
        versionName "3.0.8"

        // Vosk'un yerel kütüphaneleri: yalnızca gerçek telefon mimarileri (APK küçük kalsın)
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Kotlin kütüphane sürümlerini hizala (androidx ile Google Play kütüphaneleri farklı sürüm getirince "Duplicate class kotlin..." hatası)
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    // QR kod okuyucu (Google Play hizmetleri içinde çalışır, kamera izni gerekmez)
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    // yedek QR okuyucu: uygulamanın içinde gelir, internetten modül indirmez (fotoğraftan okur)
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    // kamera fotoğrafı için FileProvider
    implementation 'androidx.core:core:1.13.1'
    // internetsiz uyandırma kelimesi (Türkçe model ilk kullanımda indirilir)
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
    implementation 'com.alphacephei:vosk-android:0.3.47@aar'
}
