name: PR487 one-shot sync
on:
  push:
    branches:
      - gpt/brain-notes-final-authority
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/brain-notes-final-authority
          fetch-depth: 0
      - name: Apply bounded PR487 sync
        shell: powershell
        run: py -3.13 -X utf8 scripts/pr487_one_shot.py
      - name: Commit sync and remove one-shot files
        shell: powershell
        run: |
          git config user.name "jarvis-ci"
          git config user.email "jarvis-ci@users.noreply.github.com"
          git add -A
          if (-not (git diff --cached --quiet)) {
            git commit -m "test: sync PR487 notes authority expectations and roadmap"
            git push origin HEAD:gpt/brain-notes-final-authority
          }
