name: PR488 bounded green patch
on:
  push:
    branches:
      - gpt/brain-files-final-authority
    paths:
      - .github/workflows/pr488-green.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair literal replacement helper
        shell: powershell
        run: |
          $path = 'scripts/pr488_apply.py'
          $text = Get-Content $path -Raw -Encoding utf8
          $old = 'new, count = re.subn(pattern, repl, text, count=1, flags=re.S | re.M)'
          $new = 'new, count = re.subn(pattern, lambda _m: repl, text, count=1, flags=re.S | re.M)'
          $first = $text.IndexOf($old)
          if ($first -lt 0 -or $first -ne $text.LastIndexOf($old)) { throw 'sub_once satırı beklenen tek eşleşme değil' }
          [System.IO.File]::WriteAllText((Resolve-Path $path), $text.Replace($old, $new), [System.Text.UTF8Encoding]::new($false))
      - name: Apply bounded patch
        shell: powershell
        run: |
          py -3.13 -X utf8 scripts/pr488_apply.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Align old B3c1 test with final caller-zero invariant
        shell: powershell
        run: |
          @'
          from pathlib import Path
          path = Path('tests/test_brain_b3c1.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('"""PR7 Closeout-B3c-1: files.read -> Core doc_summary from a Brain-resolved file, end to end."""',
                              '"""PR7 Closeout-B3c-1/final: files.read -> Core file_action from Brain-resolved targets."""', 1)
          old = '''    def test_resolve_doc_receives_the_brain_path_and_does_not_reselect(self):
                  seen = []
          
                  def spy(runtime, raw, command=""):
                      seen.append(raw)
                      return str(self.file), None
          
                  self.ctx.docs = Mock(summarize=Mock(return_value="ÖZET"))
                  with patch.object(self.ctx, "_resolve_doc", side_effect=lambda raw, command="": spy(self.ctx, raw, command), create=True), \\
                       patch.object(brain_precedence, "claim", return_value=None):
                      entry, out, handle = self.through_brain("rapor.txt dosyasını özetle")
                  self.assertEqual(seen, [str(self.file)])
                  self.ctx.docs.summarize.assert_called_once_with(str(self.file))
          '''
          new = '''    def test_summary_uses_brain_path_without_legacy_resolve_doc(self):
                  self.ctx.docs = Mock(summarize=Mock(return_value="ÖZET"))
                  with patch.object(self.ctx, "_resolve_doc", side_effect=AssertionError("canonical file target yeniden seçilemez"), create=True), \\
                       patch.object(brain_precedence, "claim", return_value=None):
                      entry, out, handle = self.through_brain("rapor.txt dosyasını özetle")
                  self.assertEqual(out, "ÖZET\\n\\nDosya olarak almak istersen çıktı al de.")
                  self.ctx.docs.summarize.assert_called_once_with(str(self.file))
                  self.assertFalse(handle.called)
          '''
          if text.count(old) != 1:
              raise SystemExit(f'old resolve_doc test match count={text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          '@ | py -3.13 -X utf8 -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Focused tests
        shell: powershell
        run: |
          py -3.13 -X utf8 -m unittest tests.test_brain_files_final_authority tests.test_brain_b3c1 tests.test_brain_b3b
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit product changes and remove helper
        shell: powershell
        run: |
          git config user.name "jarvis-ci"
          git config user.email "jarvis-ci@users.noreply.github.com"
          git rm scripts/pr488_apply.py .github/workflows/pr488-green.yml
          git add modules/brain_understanding.py modules/brain_core_map.py modules/brain_entry.py modules/brain_precedence.py modules/engine_intents.py tests/test_brain_b3b.py tests/test_brain_b3c1.py docs/Jarvis_Yol_Haritasi.md tests/test_brain_files_final_authority.py
          git commit -m "feat: make Brain file targets canonical through Core"
          git push origin HEAD:gpt/brain-files-final-authority
