name: PR487 acceptance diagnostic
on:
  push:
    branches:
      - gpt/brain-notes-final-authority
permissions:
  contents: write
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/brain-notes-final-authority
          fetch-depth: 0
      - name: Print exact acceptance deltas
        shell: powershell
        continue-on-error: true
        run: py -3.13 -X utf8 scripts/brain_acceptance.py compare
      - name: Remove diagnostic workflow
        shell: powershell
        run: |
          Remove-Item .github/workflows/pr487-acceptance-diagnostic.yml
          git config user.name "jarvis-ci"
          git config user.email "jarvis-ci@users.noreply.github.com"
          git add -A
          git commit -m "ci: remove PR487 acceptance diagnostic"
          git push origin HEAD:gpt/brain-notes-final-authority
