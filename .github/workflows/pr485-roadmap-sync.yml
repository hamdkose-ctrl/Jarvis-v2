name: PR485 roadmap sync

on:
  push:
    branches:
      - gpt/pr481-reminder-apostrophe-v2

permissions:
  contents: write

jobs:
  sync-roadmap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/pr481-reminder-apostrophe-v2
          fetch-depth: 0
      - name: Patch only the B4c roadmap sentence and remove this helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/Jarvis_Yol_Haritasi.md')
          text = p.read_text(encoding='utf-8')
          old = "Hatırlatma başlığındaki tek başına apostrof kusuru B4c düzeltmesinde ele alınır; #481 kırmızı kalırsa merge edilmez."
          new = "Hatırlatma başlığındaki tek başına apostrof kusuru B4c v2 #485'te düzeltiliyor; exact-head Windows CI + gerçek PC watcher PASS gelmeden tamamlandı sayılmaz."
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one roadmap target, found {count}')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git rm .github/workflows/pr485-roadmap-sync.yml
          git config user.name 'jarvis-ci'
          git config user.email 'jarvis-ci@users.noreply.github.com'
          git add docs/Jarvis_Yol_Haritasi.md
          git commit -m 'docs: sync B4c roadmap before acceptance'
          git push origin HEAD:gpt/pr481-reminder-apostrophe-v2
