name: Apply Execution Policy

on:
  push:
    branches: [codex/execution-policy-stability-20261017]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply targeted integrations
        run: python scripts/apply_execution_policy_patch.py
      - name: Commit branch changes
        run: |
          git config user.name "hamdkose-ctrl"
          git config user.email "hamd.kose@gmail.com"
          git add modules tests gui.py web.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Yürütme politikalarını merkezi sözleşmelere bağla"
          git push origin HEAD:codex/execution-policy-stability-20261017
