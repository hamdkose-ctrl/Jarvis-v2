name: Execution Policy Final CI

on:
  push:
    branches: [codex/execution-policy-stability-20261017]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Project Linux validation
        run: bash scripts/linux_test_kurulum.sh --test .ci-venv
      - name: Stability contract manifest
        run: .ci-venv/bin/python tests/stability_contracts.py
