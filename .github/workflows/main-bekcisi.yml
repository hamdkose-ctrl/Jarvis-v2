name: Main bekçisi

# main'e PR'sız (doğrudan) giren her commit'i görünür yapar: iş kırmızı yanar. Hiçbir şeyi geri almaz.
# PR ile giren commit'ler (squash, merge, rebase) meşrudur: GitHub her birini ilgili PR ile ilişkilendirir.
# Checkout yok, test yok; yalnız birkaç API çağrısı. GitHub'ın squash merge ile
# commit-PR ilişkisini indekslemesi gecikebildiği için bu iş en fazla iki dakika
# bekler; yanlış kırmızıdan sonra elle yeniden çalıştırma gerektirmez.
on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  bekci:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: PR'sız commit var mı
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrEmpty($env:BEFORE) -or $env:BEFORE -eq '0000000000000000000000000000000000000000') {
            Write-Output "İlk push veya dal oluşturma; karşılaştırılacak önceki commit yok."
            exit 0
          }
          $compareJson = gh api "repos/$env:REPO/compare/$env:BEFORE...$env:AFTER" --paginate
          if ($LASTEXITCODE -ne 0) { throw "gh api compare çağrısı başarısız oldu." }
          $shas = @(($compareJson | ConvertFrom-Json).commits) | ForEach-Object { $_.sha }
          $bad = @()
          foreach ($sha in $shas) {
            $n = 0
            # Squash merge sonrası GitHub commit-PR ilişkisini gecikmeli
            # indeksleyebilir. En fazla iki dakika bekle; API hatasını
            # "PR yok" diye yorumlama.
            for ($try = 1; $try -le 12; $try++) {
              $pullsJson = gh api "repos/$env:REPO/commits/$sha/pulls"
              if ($LASTEXITCODE -ne 0) { throw "gh api commits/$sha/pulls çağrısı başarısız oldu." }
              $n = @($pullsJson | ConvertFrom-Json).Count
              if ($n -gt 0) { break }
              if ($try -lt 12) { Start-Sleep -Seconds 10 }
            }
            if ($n -eq 0) { $bad += $sha }
          }
          if ($bad.Count -gt 0) {
            $badList = $bad -join ' '
            Write-Output "::error title=main'e PR'sız commit girdi::Şu commit'ler hiçbir PR ile ilişkili değil:$badList"
            Write-Output "Bu iş yalnız uyarır, geri almaz. Commit'e bak: gerekirse PR ile geri al (git revert)."
            exit 1
          }
          Write-Output "Tüm commit'ler bir PR ile ilişkili."
