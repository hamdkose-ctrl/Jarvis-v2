name: Fix Learning Scope

on:
  push:
    branches: [codex/execution-policy-stability-20261017]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Narrow research rule scope
        run: |
          python -c "from pathlib import Path; p=Path('modules/learning.py'); t=p.read_text(encoding='utf-8'); old='|doğrula|dogrula'; assert t.count(old)==1, t.count(old); p.write_text(t.replace(old,'',1),encoding='utf-8')"
          git config user.name "hamdkose-ctrl"
          git config user.email "hamd.kose@gmail.com"
          git add modules/learning.py
          git commit -m "Davranış kurallarını konu kapsamına göre ayır"
          git push origin HEAD:codex/execution-policy-stability-20261017
