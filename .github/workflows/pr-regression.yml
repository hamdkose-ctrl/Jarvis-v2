name: PR Regression

on:
  push:
    branches: [codex/outcome-learning-pc-contract-20261017]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Project Linux validation
        run: bash scripts/linux_test_kurulum.sh --test .ci-venv
