name: PR Regression

on:
  push:
    branches: [codex/outcome-learning-pc-contract-20261017]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install cross-platform dependencies
        run: |
          grep -viE '^(pywin32|pypiwin32|comtypes|pycaw|wmi|PyGetWindow|openwakeword)==' requirements.lock.txt > /tmp/requirements-linux.txt
          python -m pip install -r /tmp/requirements-linux.txt
      - name: Outcome, learning and chat-first regressions
        run: python -m unittest tests.test_outcome_learning_contracts tests.test_chat_first_research tests.test_durable_recovery_variations
