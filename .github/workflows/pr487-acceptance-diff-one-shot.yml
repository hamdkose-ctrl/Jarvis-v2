name: PR487 acceptance diff one-shot
on:
  push:
    branches: [gpt/brain-notes-final-authority]
permissions:
  contents: write
jobs:
  report:
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/brain-notes-final-authority
          fetch-depth: 0
      - name: Print changed acceptance rows
        run: |
          py -3.13 -X utf8 scripts/brain_acceptance.py compare --report pr487_acceptance_report.json
          $compareCode = $LASTEXITCODE
          @'
          import json
          from pathlib import Path
          p=Path('pr487_acceptance_report.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          print('=== PR487 ACCEPTANCE NON-SAME ROWS ===')
          for ident,row in data.get('rows',{}).items():
              verdict=row.get('verdict')
              if verdict not in {'same','better','accepted'}:
                  print(json.dumps({'id': ident, 'verdict': verdict, 'diff': row.get('diff'), 'lost': row.get('lost'), 'gained': row.get('gained')}, ensure_ascii=False, sort_keys=True))
          print('COUNTS', json.dumps(data.get('counts',{}), ensure_ascii=False, sort_keys=True))
          '@ | Set-Content -Encoding utf8 .pr487_print.py
          py -3.13 -X utf8 .pr487_print.py
          Remove-Item .pr487_print.py, pr487_acceptance_report.json -ErrorAction SilentlyContinue
          Write-Host "compare exit=$compareCode (expected nonzero while changed rows are unaccepted)"
      - name: Remove one-shot workflow from branch
        run: |
          git config user.name "jarvis-ci"
          git config user.email "jarvis-ci@users.noreply.github.com"
          git rm .github/workflows/pr487-acceptance-diff-one-shot.yml
          git commit -m "ci: remove PR487 acceptance diff probe"
          git push origin HEAD:gpt/brain-notes-final-authority
