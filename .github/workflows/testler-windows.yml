name: Windows testleri

# Windows self-hosted runner PR doğrulamasını çalıştırır; main'e her push'ta da
# aynı iş current main SHA'sı üzerinde ayrıca çalışır (Final Stage 0-4 acceptance
# şartı: current merged main SHA'sında Windows CI kanıtı). Elle başlatma seçeneği korunur.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: testler-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testler-windows:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PR486 roadmap truth sync (one-shot)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 486
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git fetch origin "$env:BRANCH`:refs/remotes/origin/$env:BRANCH"
          git checkout -B $env:BRANCH "refs/remotes/origin/$env:BRANCH"
          @'
          from pathlib import Path
          p = Path('docs/Jarvis_Yol_Haritasi.md')
          s = p.read_text(encoding='utf-8')
          old = "- 🔄 (PR7 Closeout-B3c-2) `[1✓ 2🔄 3✓ 4✗]` Hatırlatma oluşturma Core `reminder` intent'ine alındı; `modules/reminder_parse.py` tek ayrıştırıcıdır ve planner mevcut conflict/confirmation sırasını korur. Hatırlatma başlığındaki tek başına apostrof kusuru B4c v2 #485'te düzeltiliyor; exact-head Windows CI + gerçek PC watcher PASS gelmeden tamamlandı sayılmaz."
          new = "- 🔄 (PR7 Closeout-B3c-2) `[1✓ 2🔄 3✓ 4✗]` Hatırlatma oluşturma Core `reminder` intent'ine alındı; `modules/reminder_parse.py` tek ayrıştırıcıdır ve planner mevcut conflict/confirmation sırasını korur. Hatırlatma başlığındaki tek başına apostrof kusuru B4c v2 #485'te düzeltildi; exact-head Windows CI + gerçek PC watcher PASS sonrası #485 merge edildi."
          if old not in s: raise SystemExit('PR485 roadmap satırı bulunamadı')
          s = s.replace(old, new, 1)
          old = "- 🟡 (#477 / PR7 Closeout-B3c-3) `[1✓ 2🔄 3🔄 4✗]` `notes.read` kısmen Core'a alındı: salt-okunur `notes_read`. Understanding yalnız çıplak tek komutta önerir; tek note id'si Brain referanslarıyla doğrulanır. Üretimde `selfctl` ön kapısı `notlarımı göster/notları göster` cümlelerini hâlâ UI navigation olarak yakalar; notes diğer işlemleri legacy/partial owner'dadır."
          new = "- 🟡 (#477 + #486 / PR7 Closeout-B3c-3) `[1✓ 2🔄 3✓ 4✗]` `notes.read` kısmen Core'a alındı: salt-okunur `notes_read`. Understanding yalnız çıplak tek komutta önerir; tek note id'si Brain referanslarıyla doğrulanır. #486 canonical Core `notes_read` planının `selfctl` UI navigation kapısını geçmesini sağlar; `notlarımı göster/notları göster` veri isteği olarak Core'a gider, açık `notlar sayfasını/sekmesini aç` navigasyonu selfctl'de kalır. Notes diğer işlemleri legacy/partial owner'dadır."
          if old not in s: raise SystemExit('notes roadmap satırı bulunamadı')
          s = s.replace(old, new, 1)
          old = "  1. **selfctl gölgesi:** `notlarımı göster/notları göster` hâlâ UI navigation kapısına düşüyor; `notlar sayfasını aç` ile veri isteme semantiği ayrılmalı.\n  2. **notes/files diğer işlemler:** notes oku/say/sil/düzelt/özetle/listele ile files göster/aç/bul/listele/karşılaştır/çevir/dönüştür/analiz operasyonları partial/legacy owner'da; exact UI `_file_command` deterministic front-gate olarak ayrı değerlendirilir.\n  3. **PR9 caller-zero listesi:**"
          new = "  1. **notes/files diğer işlemler:** notes oku/say/sil/düzelt/özetle/listele ile files göster/aç/bul/listele/karşılaştır/çevir/dönüştür/analiz operasyonları partial/legacy owner'da; exact UI `_file_command` deterministic front-gate olarak ayrı değerlendirilir.\n  2. **PR9 caller-zero listesi:**"
          if old not in s: raise SystemExit('kalan borç listesi bulunamadı')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          '@ | py -3.13 -
          git config user.name jarvis-ci
          git config user.email jarvis-ci@users.noreply.github.com
          git add docs/Jarvis_Yol_Haritasi.md
          git commit -m "docs: close PR486 notes selfctl shadow"
          git push origin "HEAD:$env:BRANCH"
      - name: Roadmap drift kontrolü
        run: |
          # PR checkout'u merge ref olabilir; origin/main'i ayrı remote-tracking refte
          # güncelle. main push'unda checked-out main'e fetch etmek Git tarafından
          # reddedilir ve ürün doğrulamasını daha başlamadan keser.
          git fetch origin main:refs/remotes/origin/main 2>$null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py -3.13 scripts/roadmap_drift_check.py
      - name: Roadmap tamamlanma kanıtı kontrolü
        env:
          JARVIS_PR_NUMBER: ${{ github.event.pull_request.number }}
          JARVIS_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: py -3.13 scripts/roadmap_completion_evidence_check.py
      - name: Sistem Python ve Node sürümlerini doğrula
        run: |
          $pythonVersion = py -3.13 --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($pythonVersion -notmatch '^Python 3\.13\.') {
            throw "Python 3.13 gerekli; bulunan: $pythonVersion"
          }
          $nodeVersion = node --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($nodeVersion -notmatch '^v24\.') {
            throw "Node 24 gerekli; bulunan: $nodeVersion"
          }
      - name: Sabit Windows paketleri ve ekleri
        run: |
          py -3.13 -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py -3.13 -m pip install --no-deps -r requirements.lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py -3.13 -m pip install -c requirements.lock.txt -r requirements-bundle.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py -3.13 -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sözdizimi kontrolü
        run: py -3.13 -m compileall -q -x '(^|[\\/])(\.venv|\.ci-venv|android|tmp)[\\/]' .
      - name: Tam doğrulama (Python, JavaScript ve smoke)
        env:
          JARVIS_DATA_DIR: ${{ runner.temp }}/jarvis-windows-ci
        run: py -3.13 -X utf8 -m modules.validation
      - name: Playwright Chromium hazırla (yerel model kabulü)
        if: github.event_name == 'pull_request'
        env:
          JARVIS_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $changed = git diff --name-only origin/main...$env:JARVIS_PR_HEAD_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($changed -contains 'scripts/local_model_acceptance.py' -and (Test-Path 'scripts/local_model_acceptance.py')) {
            py -3.13 -m playwright install chromium
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host 'Yerel model canlı kabulü bu PR için uygulanmıyor; Chromium kurulmadı.'
          }
      - name: Yerel model canlı kabulü (acceptance script bootstrap)
        if: github.event_name == 'pull_request'
        env:
          JARVIS_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $changed = git diff --name-only origin/main...$env:JARVIS_PR_HEAD_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($changed -contains 'scripts/local_model_acceptance.py' -and (Test-Path 'scripts/local_model_acceptance.py')) {
            py -3.13 -X utf8 scripts/local_model_acceptance.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host 'Yerel model canlı kabulü bu PR için uygulanmıyor.'
          }
